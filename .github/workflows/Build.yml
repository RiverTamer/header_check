---
name: Build
permissions:
  contents: read

on:                          # yamllint disable-line rule:truthy
  schedule:
    - cron: '55 11 * * 6'

  workflow_dispatch:

  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:

  macOS:
    runs-on:
      - self-hosted
      - macOS

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: macOS GO Build
        run: $HOME/github/bin/build_go.sh

      - name: Mark Completed
        run: touch  ${{ runner.temp }}/Green

  linux:

    runs-on:
      - self-hosted
      - linux
      - X64

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Linux GO Build
        run: $HOME/github/bin/build_go.sh

      - name: Mark Completed
        run: touch  ${{ runner.temp }}/Green
