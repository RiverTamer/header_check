---
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
    - staticcheck
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      # Specifying any rule list here replaces revive's whole default
      # rule set, so the full default set is enumerated below with
      # "exported" and "package-comments" turned off (doc comments on
      # exported identifiers/packages are a project for another day).
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
        - name: waitgroup-by-value

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
